aid: instadapp
name: Instadapp
description: >-
  Instadapp is a decentralized finance (DeFi) middleware company that scales DeFi for
  users and developers through non-custodial Smart Accounts. Its core DSA (DeFi Smart
  Accounts / DeFi Smart Layer) protocol aggregates lending, DEX, and yield protocols
  behind a single upgradable smart-contract layer, driven by a composable cast()
  function, with connectors and resolvers for protocols such as Aave, Compound,
  MakerDAO, and Uniswap. Instadapp also builds Fluid (a capital-efficient lending and
  DEX protocol), Avocado (a smart-contract wallet with account, gas, and smart-contract
  execution), and Instadapp Lite (simplified DeFi vaults). It supports Ethereum, Polygon,
  Optimism, Arbitrum, Base, Avalanche, BNB Chain, Fantom, Gnosis, Scroll, and Polygon
  zkEVM. The developer surface is on-chain smart contracts plus first-party JavaScript
  and TypeScript SDKs published to npm; there is no first-party REST API. Instadapp is
  backed by Pantera Capital.
