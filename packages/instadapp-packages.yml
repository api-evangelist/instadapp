notes: >-
  Instadapp is a DeFi middleware company. Its developer surface is on-chain smart
  contracts (DSA / DeFi Smart Accounts, Fluid, Avocado) plus first-party JavaScript
  / TypeScript client libraries published to npm under the @instadapp scope, with
  the DSA SDK published unscoped as dsa-connect. There is no first-party REST API,
  so no server-side SDKs in other languages were found. Only clearly first-party
  packages are marked official.
